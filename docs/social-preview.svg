<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<title>Aegis Wing XBLA PC Recomp</title>
<!-- Social preview for Aegis Wing XBLA PC Recomp. 1280x640, content kept 40px+ from every edge.
     Mark: the project's own icon artwork (see packaging/Make-Icon.ps1). No game assets.
     Text is live SVG text in Bahnschrift (falls back to Segoe UI / Arial);
     the PNG is rendered from this file. -->
<defs>
<pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="16" cy="16" r="1.3" fill="#FFFFFF" fill-opacity="0.07"/></pattern>
</defs>
<rect width="1280" height="640" fill="#0A0A0A"/>
<rect width="1280" height="640" fill="url(#dots)"/>
<g transform="translate(100,155)">
<polygon points="42.90,165.00 119.20,134.14 155.10,165.00 119.20,195.86" fill="#E4B56C" fill-opacity="0.5"/>
<polygon points="115.50,89.10 191.80,58.25 227.70,89.10 191.80,119.96" fill="#E4B56C" fill-opacity="0.5"/>
<polygon points="115.50,240.90 191.80,210.05 227.70,240.90 191.80,271.75" fill="#E4B56C" fill-opacity="0.5"/>
<polygon points="188.10,165.00 264.40,134.14 300.30,165.00 264.40,195.86" fill="#E4B56C" fill-opacity="1.0"/>
</g>
<text x="520" y="292" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="128" font-weight="600" fill="#F6F1E7" letter-spacing="-1">Aegis Wing</text>
<text x="520" y="368" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="66" font-weight="500" fill="#E4B56C" letter-spacing="0">XBLA PC Recomp</text>
<text x="520" y="480" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="400" fill="#9AA0A6" letter-spacing="0">Native Windows PC Recompilation</text>
<rect x="522" y="408" width="96" height="6" fill="#E4B56C"/>
</svg>
