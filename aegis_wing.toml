# Portable development defaults. Changes made in ReXGlue's F4 settings panel
# are saved back to this file.
license_mask = 1
fullscreen = false
vsync = true
video_mode_width = 1280
video_mode_height = 720
# Fixed internal render scale (2560x1440); the game enforces it at startup.
resolution_scale = 2
# Keep startup windowed launches visible even when a saved output resolution
# is larger than the desktop. The in-game resolution selector still refits
# the current window to the display.
window_width = 1280
window_height = 720
show_fps = false

# Keyboard fallback for menus and gameplay. Arrow keys map to the D-pad;
# Space is A/Confirm, Shift is B/Back, and Escape is Start/Pause.
mnk_mode = true

# Aegis Wing's XUI fonts are generated into render targets and then reused.
# Delayed readback preserves one-time glyph updates without the per-resolve CPU
# stall of full synchronization (for example, preventing "Start  ame").
readback_resolve = "fast"
